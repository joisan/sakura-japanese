/* =====================================================================
   二、工具函数（罗马音转换等）
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];
const hasKanji = s => /[一-鿿々]/.test(s);
const toKata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const rowChars = key => { const [k, r] = ROWS[key]; const ks = k.includes(' ') ? k.split(' ') : [...k]; const rs = r.split(' '); return ks.map((c, i) => [c, rs[i]]); };

const R1 = {}, R2 = {};
Object.keys(ROWS).forEach(key => rowChars(key).forEach(([c, r]) => (c.length > 1 ? R2 : R1)[c] = r));
Object.assign(R1, { ぁ:'a', ぃ:'i', ぅ:'u', ぇ:'e', ぉ:'o', ゃ:'ya', ゅ:'yu', ょ:'yo', ゔ:'vu', ゎ:'wa', '、':',' });
Object.assign(R2, { ふぁ:'fa', ふぃ:'fi', ふぇ:'fe', ふぉ:'fo', てぃ:'ti', でぃ:'di', とぅ:'tu', しぇ:'she', じぇ:'je', ちぇ:'che', うぃ:'wi', うぇ:'we', うぉ:'wo', ゔぁ:'va', ゔぃ:'vi', ゔぇ:'ve', ゔぉ:'vo', ぢゃ:'ja', ぢゅ:'ju', ぢょ:'jo' });
const SPECIAL = { は:'wa', へ:'e', を:'o', では:'dewa', には:'niwa', とは:'towa', こんにちは:'konnichiwa', こんばんは:'konbanwa' };

/** 单个词（假名）→ 罗马音 */
function roma(word) {
  if (SPECIAL[word]) return SPECIAL[word];
  const s = toHira(word); let out = '';
  const at = i => R2[s.substr(i, 2)] || R1[s[i]] || '';
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (c === 'っ') { const n = at(i + 1); out += n.startsWith('ch') ? 't' : (n[0] || ''); continue; }
    if (c === 'ー') { const m = out.match(/[aeiou]$/); out += m ? m[0] : ''; continue; }
    if (c === 'ん') { out += /^[aiueoy]/.test(at(i + 1)) ? "n'" : 'n'; continue; }
    const two = R2[s.substr(i, 2)];
    if (two) { out += two; i++; continue; }
    out += R1[c] ?? c;
  }
  return out;
}
const romaPhrase = str => str.split(' ').map(roma).join(' ');
const romaSent = (kt, p) => { const r = kt.map(roma).join(' ').replace(/ ,/g, ','); return r.charAt(0).toUpperCase() + r.slice(1) + (p ? ({ '。': '.', '？': '?', '！': '!' }[p] || '.') : (kt[kt.length - 1] === 'か' ? '?' : '.')); };
/** 罗马音输入宽松比对（兼容 shi/si、tsu/tu、长音等写法） */
const norm = s => s.toLowerCase().replace(/[^a-z]/g, '')
  .replace(/sy/g, 'sh').replace(/(ty|cy)/g, 'ch').replace(/(zy|jy)/g, 'j')
  .replace(/si/g, 'shi').replace(/ti/g, 'chi').replace(/tu/g, 'tsu').replace(/(^|[^sc])hu/g, '$1fu')
  .replace(/(zi|di)/g, 'ji').replace(/du/g, 'zu').replace(/wo/g, 'o').replace(/nn/g, 'n')
  .replace(/ou|oo/g, 'o').replace(/uu/g, 'u').replace(/aa/g, 'a').replace(/ii/g, 'i');
const ruby = (j, k) => hasKanji(j) && j !== k ? `<ruby>${j}<rt>${k}</rt></ruby>` : j;
const sentRuby = it => it.jt.map((j, i) => ruby(j, it.kt[i])).join('') + (it.p || (it.kt[it.kt.length - 1] === 'か' ? '？' : '。'));
const sentText = it => it.jt.join('');

function addWeek(stage, title, days) {
  const w = WEEKS[stage].length + 1;
  WEEKS[stage].push({ n: w, title, ids: [] });

}

}

function buildDQuiz(l) {
  const pool = poolFor(l), dl = [...new Set(l.items.map(id => ITEMS[id].dlg))]; let qs = [];

    qs = shuffle(cycle(l.items, 8 - rc).concat(shuffle(earlier).slice(0, rc)).map(id => makeQ(ITEMS[id], pool)).concat([compQ(dl[0])]));

}

function stageStats(key) {
  const ls = LESSONS.filter(l => l.stage === key);
  const done = ls.filter(isDone).length;
  const avg = arr => arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : null;
  const sc = k => ls.filter(l => l.kind === k && peek(l.id).best !== null).map(l => peek(l.id).best);
  return { total: ls.length, done, pct: Math.round(done / ls.length * 100), daily: avg(sc('learn')), review: avg(sc('review')), exam: avg(sc('exam')), all: avg(ls.filter(l => peek(l.id).best !== null).map(l => peek(l.id).best)), secs: ls.reduce((a, l) => a + peek(l.id).secs, 0) };
}
function overall() {
  const all = LESSONS.filter(l => peek(l.id).best !== null);
  const avg = k => { const a = all.filter(l => l.kind === k).map(l => peek(l.id).best); return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; };
  const parts = [[avg('learn'), 0.4], [avg('review'), 0.3], [avg('exam'), 0.3]].filter(p => p[0] !== null);
  const w = parts.reduce((a, p) => a + p[1], 0);
  const score = w ? Math.round(parts.reduce((a, p) => a + p[0] * p[1], 0) / w) : null;
  const done = LESSONS.filter(isDone).length;
  return { score, grade: score === null ? '—' : score >= 95 ? 'S' : score >= 85 ? 'A' : score >= 75 ? 'B' : score >= 60 ? 'C' : 'D', done, total: LESSONS.length, pct: Math.round(done / LESSONS.length * 100), daily: avg('learn'), review: avg('review'), exam: avg('exam') };
}
function continueTarget() {
  if (S.cursor && LMAP[S.cursor.id]) return { l: LMAP[S.cursor.id], resume: true };

}

}

  const resume = S.cursor && S.cursor.id === id;
  showModal(`<div class="p-6">
    <p class="text-xs font-extrabold ${th.text}">${th.name} · 第 ${l.week} 周 · ${DAYN[l.day - 1]} · ${kindLabel(l)}</p>
    <h3 class="text-2xl font-black jp mt-1">${esc(l.title)}</h3>
    <p class="jp text-slate-500 mt-2 text-sm leading-relaxed">${esc(preview)}</p>
    <div class="grid grid-cols-3 gap-2 mt-5 text-center">
      <div class="rounded-2xl bg-slate-50 p-3"><div class="text-xs text-slate-500">最高分</div><div class="text-xl font-black">${r.best ?? '—'}</div></div>
      <div class="rounded-2xl bg-slate-50 p-3"><div class="text-xs text-slate-500">星级</div><div>${stars(r.stars, 'text-lg')}</div></div>
      <div class="rounded-2xl bg-slate-50 p-3"><div class="text-xs text-slate-500">学习时间</div><div class="text-xl font-black">${fmtMin(r.secs)}<span class="text-xs">分</span></div></div>
    </div>
    ${!un ? '<p class="mt-5 text-sm text-slate-500">🔒 完成上一课（得分 ≥ 60）后解锁</p>' : `<div class="mt-6 grid gap-2">
      ${resume ? `<button data-action="open" data-id="${id}" class="${btn(`py-3.5 ${th.solid} ${th.solidB} text-white`)}">继续上次进度</button>` : ''}
      ${l.kind === 'learn' ? `<button data-action="open" data-id="${id}" data-mode="learn" class="${btn(`py-3.5 ${resume ? 'bg-white text-ink border-slate-200 border-2' : `${th.solid} ${th.solidB} text-white`}`)}">📖 学习卡片</button>
        <button data-action="open" data-id="${id}" data-mode="quiz" ${r.learned || S.settings.unlockAll ? '' : 'disabled'} class="${btn('py-3.5 bg-amber-400 border-amber-600 text-ink')}">🎮 开始练习${r.learned ? '' : '（学完卡片后解锁）'}</button>`
      : `<button data-action="open" data-id="${id}" data-mode="intro" class="${btn(`py-3.5 ${th.solid} ${th.solidB} text-white`)}">${l.kind === 'exam' ? '👑 开始结业考试' : '🏆 开始周测验'}</button>`}
    </div>`}
  </div>`);
}

function openLesson(id, mode = 'auto') {
  closeModal();
  const l = LMAP[id];
  if (S.cursor && S.cursor.id === id && mode === 'auto') { V = { name: S.cursor.phase }; render(); return; }
  if (l.kind !== 'learn') S.cursor = { id, phase: 'intro' };
  else if (mode === 'quiz') S.cursor = { id, phase: 'quiz', quiz: buildQuiz(l) };
  else S.cursor = { id, phase: 'learn', card: 0 };
  T = {}; V = { name: S.cursor.phase, flipped: false }; save(); render();
}

/* ---------- 学习卡片 ---------- */
function lessonCards(l) { return (l.note ? [{ type: 'note', ...l.note }] : []).concat(l.items.map(id => ITEMS[id])); }

function cardFront(it, th) {
  if (it.type === 'kana') return `<span class="absolute top-5 left-5 text-xs font-bold px-3 py-1 rounded-full ${th.soft} ${th.text}">${it.script === 'hira' ? '平假名' : '片假名'}</span>
    <div class="jp text-[120px] sm:text-[150px] font-bold leading-none ${th.text}">${it.c}</div>`;
  if (it.type === 'kanji') return `<span class="absolute top-5 left-5 text-xs font-bold px-3 py-1 rounded-full ${th.soft} ${th.text}">汉字</span>
    <div class="jp text-[120px] sm:text-[150px] font-bold leading-none">${it.c}</div>`;
  if (it.type === 'vocab') return `<span class="absolute top-5 left-5 text-xs font-bold px-3 py-1 rounded-full ${th.soft} ${th.text}">词汇</span>
    <div class="jp ${it.w.length > 6 ? 'text-4xl sm:text-5xl' : 'text-6xl sm:text-7xl'} font-bold text-center">${it.w}</div>`;
  return `<span class="absolute top-5 left-5 text-xs font-bold px-3 py-1 rounded-full ${th.soft} ${th.text} jp">${esc(it.g)}</span>
    <div class="jp text-3xl sm:text-4xl font-bold text-center leading-[1.9] ${S.settings.furigana ? '' : 'nofuri'}">${sentRuby(it)}</div>
    <div class="mt-3 text-slate-500 text-center">${romaSent(it.kt, it.p)}</div>`;
}
function cardBack(it) {
  if (it.type === 'kana') return `<div class="text-7xl font-black tracking-wide">${it.r}</div>
    <div class="mt-3 flex items-center gap-3"><span class="text-white/70 text-sm">${it.script === 'hira' ? '对应片假名' : '对应平假名'}</span><span class="jp text-3xl font-bold">${it.pair}</span></div>
    ${it.ex ? `<div class="mt-6 rounded-2xl bg-white/15 px-5 py-4 flex items-center gap-4"><div class="text-left"><div class="jp text-2xl font-bold">${it.ex.w !== it.ex.k ? ruby(it.ex.w, it.ex.k.replace(/ /g, '')) : it.ex.k}</div><div class="text-sm text-white/80">${romaPhrase(it.ex.k)} · ${it.ex.zh}</div></div>${spkBtn(it.ex.k.includes(' ') ? it.ex.w : it.ex.k, 'w-10 h-10', true)}</div>` : '<p class="mt-6 text-white/70 text-sm">现代日语中几乎只用平假名「を」</p>'}`;
  if (it.type === 'kanji') return `<div class="text-4xl font-black">${it.zh}</div>
    <div class="mt-4 grid grid-cols-2 gap-3 w-full max-w-sm text-left">
      <div class="rounded-2xl bg-white/15 p-3"><div class="text-xs text-white/70">音读</div><div class="jp text-lg font-bold">${it.on}</div><div class="text-xs text-white/70">${it.on.split('・').map(roma).join(' / ')}</div></div>
      <div class="rounded-2xl bg-white/15 p-3"><div class="text-xs text-white/70">训读</div><div class="jp text-lg font-bold">${it.kun === '-' ? '—' : it.kun}</div><div class="text-xs text-white/70">${it.kun === '-' ? '' : it.kun.replace(/[()]/g, '').split('・').map(roma).join(' / ')}</div></div>
    </div>
    <div class="mt-4 rounded-2xl bg-white/15 px-5 py-3 flex items-center gap-4"><div class="text-left"><div class="jp text-2xl font-bold">${ruby(it.ex.w, it.ex.k)}</div><div class="text-sm text-white/80">${roma(it.ex.k)} · ${it.ex.zh}</div></div>${spkBtn(it.ex.k, 'w-10 h-10', true)}</div>`;
  if (it.type === 'vocab') return `${it.w !== it.k ? `<div class="jp text-2xl text-white/80">${it.w}</div>` : ''}
    <div class="jp text-5xl font-bold mt-1">${it.k}</div>
    <div class="text-lg text-white/80 mt-2 tracking-wide">${roma(it.k)}</div>
    <div class="text-3xl font-black mt-5">${it.zh}</div>`;
  return `<div class="text-2xl sm:text-3xl font-black text-center">${it.zh}</div>
    <div class="mt-3 text-white/85 text-center">${romaSent(it.kt, it.p)}</div>
    <div class="mt-5 flex flex-wrap justify-center gap-2 max-w-lg">${it.jt.map((j, i) => `<span class="rounded-xl bg-white/15 px-3 py-1.5 text-center"><span class="jp block font-bold">${j}</span><span class="block text-[11px] text-white/75">${roma(it.kt[i])}</span></span>`).join('')}</div>`;
}

function viewLearn() {
  const l = LMAP[S.cursor.id], th = TH[l.stage], cards = lessonCards(l), i = S.cursor.card, it = cards[i];
  if (l.stage === 'D') return viewDlgLearn(l, cards, i);
  const last = i === cards.length - 1;
  let card;
  if (it.type === 'note') {
    card = `<div class="pop rounded-[32px] bg-white shadow-xl border border-black/5 p-8 sm:p-10 min-h-[400px] flex flex-col justify-center">
      <span class="self-start text-xs font-bold px-3 py-1 rounded-full ${th.soft} ${th.text}">${l.stage === 'C' ? '📘 句型讲解' : '💡 学习提示'}</span>
      <h2 class="jp text-3xl sm:text-4xl font-black mt-4">${esc(it.t)}</h2>
      <p class="mt-4 text-lg leading-relaxed text-slate-600 jp">${esc(it.b)}</p>
      ${l.stage === 'C' ? `<p class="mt-6 text-sm text-slate-400">接下来有 ${l.items.length} 个例句，每句都附罗马音和中文。</p>` : ''}
    </div>`;
  } else {
    const say = it.type === 'kana' ? it.c : it.type === 'kanji' ? it.ex.k : it.type === 'vocab' ? it.k : sentText(it);
    card = `<div class="scene">
      <div id="card" data-action="flip" class="card-inner ${V.flipped ? 'flipped' : ''} relative h-[420px] cursor-pointer select-none">
        <div class="face absolute inset-0 rounded-[32px] bg-white shadow-xl border border-black/5 flex flex-col items-center justify-center p-6">
          ${cardFront(it, th)}
          <div class="mt-8">${spkBtn(say, 'w-14 h-14')}</div>
          <p class="absolute bottom-5 text-xs text-slate-400">点击卡片翻面 · 空格键</p>
        </div>
        <div class="face face-back absolute inset-0 rounded-[32px] bg-gradient-to-br ${th.grad} text-white shadow-xl flex flex-col items-center justify-center p-6">
          ${cardBack(it)}
          <div class="absolute top-4 right-4">${spkBtn(say, 'w-11 h-11', true)}</div>
        </div>
      </div>
    </div>`;
  }
  return `<div class="max-w-2xl mx-auto pt-5">
    ${focusBar(l, (i + 1) / cards.length, `${i + 1} / ${cards.length}`)}
    <p class="text-center text-sm font-bold text-slate-500 mt-4 jp">${esc(l.title)}</p>
    <div class="mt-4">${card}</div>
    <div class="mt-7 flex items-center justify-center gap-3">
      <button data-action="prev" ${i === 0 ? 'disabled' : ''} class="${btn('px-5 sm:px-6 py-3.5 bg-white border-2 border-slate-200 text-slate-700')}">← 上一页</button>
      ${it.type !== 'note' ? `<button data-action="flip" class="${btn('px-4 py-3.5 bg-ink border-black text-white')}" title="翻转">⟲</button>` : ''}
      <button data-action="next" class="${btn(`px-5 sm:px-6 py-3.5 ${last ? 'bg-amber-400 border-amber-600 text-ink' : `${th.solid} ${th.solidB} text-white`}`)}">${last ? '开始练习 🎮' : '下一页 →'}</button>
    </div>
    ${l.stage === 'C' && it.type === 'sent' ? `<div class="text-center mt-4"><button data-action="furi" class="text-sm font-bold text-slate-500 hover:text-ink">${S.settings.furigana ? '隐藏' : '显示'}注音假名</button></div>` : ''}
    <p class="hidden sm:block text-center text-xs text-slate-400 mt-5">快捷键：← → 翻页 · 空格 翻转 · P 发音</p>
  </div>`;
}

function viewDlgLearn(l, cards, i) {
  const th = TH.D, d = DLG[l.dlg], last = i === cards.length - 1;
  let body;
  if (i === 0) {
    body = `<div class="pop rounded-[32px] bg-white shadow-xl border border-black/5 p-8 sm:p-10 min-h-[400px] flex flex-col justify-center">
      <span class="self-start text-xs font-bold px-3 py-1 rounded-full ${th.soft} ${th.text}">💬 会话场景</span>
      <h2 class="jp text-3xl sm:text-4xl font-black mt-4">${esc(d.title)}</h2>
      <p class="mt-4 text-lg leading-relaxed text-slate-600">${esc(d.scene)}</p>
      <div class="mt-5 flex flex-wrap gap-2 text-sm font-bold"><span class="px-3 py-1.5 rounded-xl bg-slate-100">对方：${esc(d.a)}</span><span class="px-3 py-1.5 rounded-xl bg-sky-100 text-sky-700">你：我</span><span class="px-3 py-1.5 rounded-xl bg-slate-100">${d.lines.length} 句</span></div>
      <p class="mt-5 text-sm text-slate-400">点「下一句」逐句学习，每句会自动播放发音。练习时你要扮演「我」。</p>
      <button data-action="playdlg" data-id="${d.id}" class="${btn('mt-6 self-start px-5 py-3 bg-sky-500 border-sky-700 text-white')}">▶ 先听一遍整段对话</button>
    </div>`;
  } else {
    const shown = cards.slice(1, i + 1);
    body = `<div id="chat" class="rounded-[32px] bg-white/70 border border-black/5 p-4 sm:p-6 h-[440px] overflow-y-auto space-y-4 ${S.settings.furigana ? '' : 'nofuri'}">
      ${shown.map((it, k) => `<div class="${k === shown.length - 1 ? 'pop' : 'opacity-60'} flex items-end gap-2 ${it.sp === 'B' ? 'justify-end' : 'justify-start'}">${it.sp === 'B' ? spkBtn(sentText(it), 'w-9 h-9 mb-1', false, 'B') : ''}<div class="min-w-0 max-w-[85%]">${lineBubble(it, d)}</div>${it.sp !== 'B' ? spkBtn(sentText(it), 'w-9 h-9 mb-1', false, 'A') : ''}</div>`).join('')}
    </div>`;
    V.after = () => { const c = $('#chat'); if (c) c.scrollTop = c.scrollHeight; };
  }
  return `<div class="max-w-2xl mx-auto pt-5">
    ${focusBar(l, (i + 1) / cards.length, `${i + 1} / ${cards.length}`)}
    <p class="text-center text-sm font-bold text-slate-500 mt-4 jp">${esc(l.title)}</p>
    <div class="mt-4">${body}</div>
    <div class="mt-7 flex items-center justify-center gap-3 flex-wrap">
      <button data-action="prev" ${i === 0 ? 'disabled' : ''} class="${btn('px-5 sm:px-6 py-3.5 bg-white border-2 border-slate-200 text-slate-700')}">← 上一句</button>
      ${i > 0 ? `<button data-action="playdlg" data-id="${d.id}" class="${btn('px-4 py-3.5 bg-ink border-black text-white')}" title="播放整段对话">▶ 整段</button>` : ''}
      <button data-action="next" class="${btn(`px-5 sm:px-6 py-3.5 ${last ? 'bg-amber-400 border-amber-600 text-ink' : `${th.solid} ${th.solidB} text-white`}`)}">${last ? '开始练习 🎮' : '下一句 →'}</button>
    </div>
    ${i > 0 ? `<div class="text-center mt-4"><button data-action="furi" class="text-sm font-bold text-slate-500 hover:text-ink">${S.settings.furigana ? '隐藏' : '显示'}注音假名</button></div>` : ''}
    <p class="hidden sm:block text-center text-xs text-slate-400 mt-5">快捷键：← → 上一句 / 下一句 · P 播放最新一句</p>
  </div>`;
}

function focusBar(l, p, label) {
  const th = TH[l.stage], tm = S.days[today()] || 0;
  return `<div class="flex items-center gap-3">
    <button data-action="quit" title="退出（进度会保存）" class="w-10 h-10 shrink-0 rounded-xl hover:bg-black/5 grid place-items-center text-slate-500 text-2xl">×</button>
    <div class="flex-1 h-4 rounded-full bg-slate-200/80 overflow-hidden"><div class="h-full rounded-full ${th.solid} transition-all duration-500" style="width:${Math.round(p * 100)}%"></div></div>
    <span class="text-sm font-black text-slate-500 shrink-0">${label}</span>
    <span title="今日学习时间" class="shrink-0 text-xs font-bold px-2 py-1 rounded-lg bg-white border border-black/5">⏱ <span id="todayMin">${fmtMin(tm)}</span>/60</span>
  </div>`;
}

/* ---------- 测验介绍 ---------- */
function viewIntro() {
  const l = LMAP[S.cursor.id], th = TH[l.stage], r = peek(l.id);
  const n = l.kind === 'exam' ? 25 : 15;
  return `<div class="max-w-xl mx-auto pt-5">
    ${focusBar(l, 0, '')}
    <div class="pop mt-10 rounded-[32px] bg-white shadow-xl border border-black/5 p-8 text-center">
      <div class="text-7xl">${l.kind === 'exam' ? '👑' : '🏆'}</div>
      <p class="mt-4 text-sm font-extrabold ${th.text}">${th.name} · 第 ${l.week} 周 · ${DAYN[l.day - 1]}</p>
      <h2 class="text-3xl font-black mt-1">${esc(l.title)}</h2>
      <p class="mt-3 text-slate-500">${l.kind === 'exam' ? `覆盖整个${th.name}「${th.title}」的内容` : `复习本周「${esc(l.wtitle)}」的全部内容`}，共 ${n} 题。${l.kind === 'exam' ? '考试中答错不会重练。' : ''}</p>
      ${r.best !== null ? `<p class="mt-2 text-sm text-slate-500">历史最高：<b>${r.best}</b> 分 ${stars(r.stars)}</p>` : ''}
      <button data-action="startquiz" class="${btn(`mt-7 w-full py-4 text-lg ${th.solid} ${th.solidB} text-white`)}">开始</button>
    </div>
  </div>`;
}

/* ---------- 练习 ---------- */
function viewQuiz() {
  const l = LMAP[S.cursor.id], th = TH[l.stage], Q = S.cursor.quiz, q = Q.qs[Q.i];
  const answered = Q.fb && Q.fb.i === Q.i;
  let body = '';
  if (q.qt === 'mc') {
    const sel = answered ? Q.fb.sel : -1;
    body = `${q.audio ? `<div class="flex justify-center mb-4">${spkBtn(q.audio, 'w-20 h-20', false, q.role || '')}</div>` : ''}
      ${q.main ? `<div class="text-center mb-6">${q.main}</div>` : ''}
      <div class="grid ${q.opts.some(o => o.h.length > 60) ? 'grid-cols-1' : 'grid-cols-2'} gap-3">
        ${q.opts.map((o, k) => { let st = 'bg-white border-slate-200 hover:bg-slate-50';
          if (answered) { if (o.v === q.ans) st = 'bg-emerald-50 border-emerald-500 text-emerald-700'; else if (k === sel) st = 'bg-red-50 border-red-400 text-red-600 shake'; else st = 'bg-white border-slate-200 opacity-50'; }
          return `<button data-action="opt" data-k="${k}" ${answered ? 'disabled' : ''} class="btn3d relative rounded-2xl border-2 px-4 py-4 min-h-[64px] font-bold text-lg text-center ${st}"><span class="absolute top-1.5 left-2.5 text-[10px] text-slate-300 font-black">${k + 1}</span>${o.h}</button>`; }).join('')}
      </div>`;
  } else if (q.qt === 'type') {
    body = `<div class="text-center mb-6">${q.main}</div>
      <input id="typeIn" autocomplete="off" autocapitalize="off" spellcheck="false" ${answered ? 'disabled' : ''} value="${answered ? esc(Q.fb.val || '') : ''}" placeholder="在这里输入罗马音，例如 ka" class="w-full text-center text-2xl font-bold rounded-2xl border-2 ${answered ? (Q.fb.ok ? 'border-emerald-500 bg-emerald-50' : 'border-red-400 bg-red-50') : 'border-slate-200 bg-white'} px-4 py-4 outline-none focus:border-sky-400">
      ${answered ? '' : `<button data-action="check" class="${btn('mt-4 w-full py-3.5 bg-emerald-500 border-emerald-700 text-white text-lg')}">检查</button>`}`;
  } else if (q.qt === 'build') {
    const picked = answered ? (Q.fb.picked || []) : (T.picked || []);
    body = `<div class="flex items-center gap-3 mb-5 rounded-2xl bg-white border border-black/5 p-4">
        ${spkBtn(q.audio, 'w-12 h-12', false, q.role || '')}<div class="text-lg font-bold">${esc(q.zh)}</div></div>
      <div class="min-h-[86px] rounded-2xl border-2 border-dashed ${answered ? (Q.fb.ok ? 'border-emerald-400 bg-emerald-50' : 'border-red-300 bg-red-50') : 'border-slate-300 bg-white/60'} p-3 flex flex-wrap gap-2 content-start">
        ${picked.map((ti, pi) => tileHtml(q.tiles[ti], `data-action="untile" data-p="${pi}"`, answered)).join('') || '<span class="text-slate-400 text-sm m-auto">点击下面的词块，组成句子</span>'}
      </div>
      <div class="mt-5 flex flex-wrap gap-2 justify-center">
        ${q.tiles.map((t, ti) => picked.includes(ti) ? `<span class="rounded-xl bg-slate-200/70 px-3 py-2 opacity-60"><span class="jp invisible font-bold text-lg">${t.j}</span></span>` : tileHtml(t, `data-action="tile" data-t="${ti}"`, answered)).join('')}
      </div>
      ${answered ? '' : `<button data-action="check" ${picked.length ? '' : 'disabled'} class="${btn('mt-6 w-full py-3.5 bg-emerald-500 border-emerald-700 text-white text-lg')}">检查</button>`}`;
  } else if (q.qt === 'match') {
    const done = T.done || [];
    const cell = (side, idx, label) => { const isDoneP = done.includes(idx), sel = side === 'l' ? T.l === idx : T.r === idx, bad = T.bad && T.bad[side] === idx;
      return `<button data-action="m${side}" data-k="${idx}" ${isDoneP || answered ? 'disabled' : ''} class="btn3d w-full rounded-2xl border-2 px-3 h-[60px] font-bold ${side === 'l' ? 'jp text-2xl' : 'text-base'} ${isDoneP || answered ? 'bg-emerald-50 border-emerald-300 text-emerald-600 opacity-60' : bad ? 'bg-red-50 border-red-400 shake' : sel ? 'bg-sky-50 border-sky-500 text-sky-700' : 'bg-white border-slate-200 hover:bg-slate-50'}">${esc(label)}</button>`; };
    body = `<div class="grid grid-cols-2 gap-3">
      <div class="space-y-3">${q.pairs.map((p, k) => cell('l', k, p.l)).join('')}</div>
      <div class="space-y-3">${q.order.map(k => cell('r', k, q.pairs[k].r)).join('')}</div>
    </div>`;
  } else if (q.qt === 'order') {
    const picked = answered ? (Q.fb.picked || []) : (T.picked || []);
    body = `<div class="min-h-[120px] rounded-2xl border-2 border-dashed ${answered ? (Q.fb.ok ? 'border-emerald-400 bg-emerald-50' : 'border-red-300 bg-red-50') : 'border-slate-300 bg-white/60'} p-3 space-y-2">
      ${picked.map((si, pi) => `<button data-action="ounpick" data-p="${pi}" ${answered ? 'disabled' : ''} class="flex gap-2 w-full text-left"><span class="text-xs font-black text-slate-400 pt-5">${pi + 1}</span><span class="flex-1">${q.items[si].h}</span></button>`).join('') || '<p class="text-slate-400 text-sm text-center py-10">按对话的先后顺序，点击下面的句子</p>'}
    </div>
    <div class="mt-4 space-y-2">${q.shuf.filter(si => !picked.includes(si)).map(si => `<button data-action="opick" data-s="${si}" ${answered ? 'disabled' : ''} class="block w-full text-left rounded-2xl hover:bg-white p-1 transition">${q.items[si].h}</button>`).join('')}</div>
    ${answered ? (Q.fb.ok ? '' : `<div class="mt-4 rounded-2xl bg-white border border-black/5 p-3 space-y-2"><p class="text-sm font-bold text-emerald-600">正确顺序：</p>${q.items.map(x => x.h).join('')}</div>`) : `<button data-action="check" ${picked.length === q.items.length ? '' : 'disabled'} class="${btn('mt-6 w-full py-3.5 bg-emerald-500 border-emerald-700 text-white text-lg')}">检查</button>`}`;

      : SR ? `<div class="flex items-center gap-4">${spkBtn(q.say, 'w-14 h-14', false, 'B')}
          <button data-action="mic" title="点击后开始说" class="w-20 h-20 rounded-full grid place-items-center text-white text-3xl shadow-lg transition ${T.listening ? 'bg-red-500 mic-on' : 'bg-gradient-to-br from-sky-500 to-cyan-500 hover:scale-105'}">🎤</button></div>

  }
  const tone = !answered ? {} : Q.fb.ok ? { bg: 'bg-emerald-100', bd: 'border-emerald-300', tx: 'text-emerald-700', btn: 'bg-emerald-500 border-emerald-700' } : q.qt === 'speak' ? { bg: 'bg-slate-100', bd: 'border-slate-300', tx: 'text-slate-700', btn: 'bg-slate-600 border-slate-800' } : { bg: 'bg-red-100', bd: 'border-red-300', tx: 'text-red-600', btn: 'bg-red-500 border-red-700' };
  const fb = answered ? `<div style="padding-bottom: env(safe-area-inset-bottom, 0px)" class="fixed inset-x-0 bottom-0 z-40 slideup ${tone.bg} border-t-2 ${tone.bd}">
      <div class="max-w-2xl mx-auto px-4 py-5 flex flex-col sm:flex-row sm:items-center gap-4">

  if (!answered && q.audio && !q.noAuto && T.autoPlayed !== Q.i) { T.autoPlayed = Q.i; V.after = () => speak(q.audio, null, q.role); }
  if (!answered && q.dlg && T.autoPlayed !== Q.i) { T.autoPlayed = Q.i; V.after = () => speakDlg(q.dlg); }
  if (q.qt === 'type' && !answered) V.after = () => { const el = $('#typeIn'); if (el) el.focus(); };
  return `<div class="max-w-2xl mx-auto pt-5 pb-40">

  </div>${fb}`;
}
const tileHtml = (t, attrs, dis) => `<button ${attrs} ${dis ? 'disabled' : ''} class="btn3d rounded-xl bg-white border-2 border-slate-200 px-3 py-1.5 hover:bg-slate-50 text-center"><span class="jp block font-bold text-lg leading-tight">${ruby(t.j, t.k)}</span><span class="block text-[10px] text-slate-400">${roma(t.k)}</span></button>`;

function grade(ok, extra = {}) {
  const Q = S.cursor.quiz, q = Q.qs[Q.i]; let val = ok ? 1 : 0;
  if (q.qt === 'match') { const m = T.miss || 0; val = m === 0 ? 1 : m <= 2 ? 0.5 : 0; ok = m <= 2; }
  let gain = 0;
  if (!q.retry && !q.bonus) { Q.pts += val; if (ok) Q.right++; }
  if (ok) { Q.combo++; Q.maxCombo = Math.max(Q.maxCombo, Q.combo); gain = q.retry ? 5 : 10 + Math.min(Q.combo - 1, 5) * 2; Q.xp += gain; sfx(true); }
  else {
    Q.combo = 0; sfx(false);
    if (!q.retry && !q.bonus && q.qt !== 'match') { Q.wrong.push(q.fb); if (Q.kind !== 'exam') Q.qs.push({ ...q, retry: true, opts: q.opts ? shuffle(q.opts) : q.opts, tiles: q.tiles ? shuffle(q.tiles) : q.tiles }); }
  }
  Q.fb = { i: Q.i, ok, gain, ...extra };
  if (S.settings.autoSpeak && q.say && q.qt !== 'match' && q.qt !== 'speak') setTimeout(() => speak(q.say, null, q.sayRole), 250);
  save(); V.keepScroll = true; render();
}
function nextQ() {
  const Q = S.cursor.quiz; Q.i++; T = {};
  if (Q.i >= Q.qs.length) return finish();
  save(); render();
}
function finish() {
  const Q = S.cursor.quiz, l = LMAP[S.cursor.id];
  const score = Math.round(Q.pts / Q.scored * 100), st = score >= 95 ? 3 : score >= 80 ? 2 : score >= 60 ? 1 : 0;
  const r = rec(l.id); const prevBest = r.best;
  r.attempts++; r.last = score; r.best = Math.max(r.best ?? 0, score); r.stars = Math.max(r.stars, st); if (l.kind === 'learn') r.learned = true;
  r.hist = (r.hist || []).concat([[today(), score]]).slice(-10);
  S.xp += Q.xp; S.bestCombo = Math.max(S.bestCombo, Q.maxCombo);
  V = { name: 'result', id: l.id, score, stars: st, xp: Q.xp, right: Q.right, total: Q.scored, wrong: [...new Set(Q.wrong)].slice(0, 8), maxCombo: Q.maxCombo, newBest: prevBest === null || score > prevBest, secs: Math.round((Date.now() - Q.start) / 1000) };
  S.cursor = null; save(); pushNow(); render();
  if (score >= 80) confetti();
}

  </div>`);
}

let toastT;
function toast(msg) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'pointer-events-none fixed top-5 left-1/2 -translate-x-1/2 z-[70] px-4 py-2.5 rounded-2xl bg-ink text-white text-sm font-bold shadow-lg transition-opacity duration-300'; document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, 1800);
}

/* ---------- 彩带 ---------- */
function confetti() {
  const cv = $('#confetti'), ctx = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#f43f5e', '#f59e0b', '#14b8a6', '#8b5cf6', '#38bdf8', '#fb7185'];
  const ps = Array.from({ length: 140 }, () => ({ x: cv.width / 2 + (Math.random() - .5) * 200, y: cv.height / 3, vx: (Math.random() - .5) * 14, vy: Math.random() * -14 - 4, s: Math.random() * 6 + 4, c: pick(cols), r: Math.random() * 6, vr: (Math.random() - .5) * .3 }));
  let f = 0;
  (function loop() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (++f < 150) requestAnimationFrame(loop); else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}

/* =====================================================================
   八、事件处理
   ===================================================================== */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-action]');
  if (!a) return;
  if (a.dataset.action === 'closemodal' && e.target.closest('[data-stop]') && !e.target.closest('button[data-action="closemodal"]')) return;
  const act = a.dataset.action;
  if (act === 'import') return;
  if (a.disabled) return;
  switch (act) {
    case 'nav': V = { name: a.dataset.to }; closeModal(); render(); break;
    case 'stage': V = { name: 'stage', key: a.dataset.key }; closeModal(); render(); break;
    case 'settings': showSettings(); break;
    case 'closemodal': closeModal(); break;
    case 'node': { const l = LMAP[a.dataset.id]; showNode(l.id); break; }
    case 'open': openLesson(a.dataset.id, a.dataset.mode || 'auto'); break;
    case 'speak': speak(a.dataset.say, a, a.dataset.role); break;
    case 'playdlg': speakDlg(a.dataset.id); break;
    case 'opick': T.picked = (T.picked || []).concat(+a.dataset.s); V.keepScroll = true; render(); break;
    case 'ounpick': T.picked.splice(+a.dataset.p, 1); V.keepScroll = true; render(); break;
    case 'mic': startListen(); break;
    case 'skip': if (!T.listening) grade(false, { skipped: true }); break;
    case 'flip': V.flipped = !V.flipped; { const c = $('#card'); if (c) c.classList.toggle('flipped', V.flipped); } break;
    case 'prev': learnMove(-1); break;
    case 'next': learnMove(1); break;
    case 'furi': S.settings.furigana = !S.settings.furigana; save(); V.keepScroll = true; render(); break;
    case 'quit': { const l = LMAP[S.cursor.id]; save(); if (hasTTS) speechSynthesis.cancel(); toast('进度已保存，下次从这里继续'); V = { name: 'stage', key: l.stage }; render(); break; }
    case 'startquiz': S.cursor.phase = 'quiz'; S.cursor.quiz = buildQuiz(LMAP[S.cursor.id]); T = {}; V = { name: 'quiz' }; save(); render(); break;
    case 'opt': { const Q = S.cursor.quiz, q = Q.qs[Q.i], k = +a.dataset.k; grade(q.opts[k].v === q.ans, { sel: k }); break; }
    case 'check': doCheck(); break;
    case 'tile': T.picked = (T.picked || []).concat(+a.dataset.t); V.keepScroll = true; render(); { const Q = S.cursor.quiz; const t = Q.qs[Q.i].tiles[+a.dataset.t]; if (S.settings.autoSpeak && !SPECIAL[t.k]) speak(t.j); } break;
    case 'untile': T.picked.splice(+a.dataset.p, 1); V.keepScroll = true; render(); break;
    case 'ml': case 'mr': matchClick(act === 'ml' ? 'l' : 'r', +a.dataset.k); break;
    case 'cont': nextQ(); break;
    case 'backup': showBackup(); break;
    case 'syncinfo': showSyncInfo(); break;
    case 'gdlogin': gdLogin(); break;
    case 'saveclient': { const v = ($('#gClientId') || {}).value || ''; S.settings.gClientId = v.trim(); saveLocal(); closeModal(); toast(v.trim() ? '已保存客户端 ID' : '已清除客户端 ID'); if (canDrive()) initDrive(); else { syncProvider = null; setSync(window.claude ? syncState : 'local'); } break; }
    case 'syncnow': lastPushed = ''; pushNow().then(() => { toast(syncState === 'ok' ? '✅ 已同步' : '同步没有成功，请稍后再试'); showSyncInfo(); }); break;
    case 'syncretry': closeModal(); initSync().then(() => toast(syncState === 'ok' ? '✅ 已连接云同步' : '还是无法连接，请看提示')); break;
    case 'copycode': { const ta = $('#bkOut'); const done = () => toast('已复制进度代码'); const fallback = () => { ta.focus(); ta.select(); toast('已选中，请长按或按 Ctrl+C 复制'); }; try { navigator.clipboard.writeText(ta.value).then(done, fallback); } catch (er) { fallback(); } break; }
    case 'savefile': saveFile(); break;
    case 'importcode': importData(($('#bkIn') || {}).value || ''); break;
    case 'resetyes': S = defaultState(); S.resetAt = Date.now(); save(); pushNow(); closeModal(); V = { name: 'home' }; render(); toast('已清除全部进度'); break;
    case 'reset': showModal(`<div class="p-6"><h3 class="text-xl font-black">清除全部进度？</h3><p class="mt-2 text-slate-600">所有课程的分数、星级和学习时间都会被删除，无法恢复。建议先备份进度代码。</p><div class="grid grid-cols-2 gap-2 mt-6"><button data-action="settings" class="${btn('py-3 bg-white border-2 border-slate-200')}">取消</button><button data-action="resetyes" class="${btn('py-3 bg-red-500 border-red-700 text-white')}">确认清除</button></div></div>`); break;
  }
});
function learnMove(d) {
  const l = LMAP[S.cursor.id], n = lessonCards(l).length;
  if (d > 0 && S.cursor.card === n - 1) {
    rec(l.id).learned = true;
    S.cursor = { id: l.id, phase: 'quiz', quiz: buildQuiz(l) }; T = {}; V = { name: 'quiz' }; save(); render(); return;
  }
  S.cursor.card = Math.max(0, Math.min(n - 1, S.cursor.card + d)); V.flipped = false; save(); render();
  if (l.stage === 'D' && d > 0 && S.cursor.card > 0 && S.settings.autoSpeak) { const it = lessonCards(l)[S.cursor.card]; setTimeout(() => speak(sentText(it), null, it.sp), 200); }
}
function doCheck() {
  const Q = S.cursor.quiz, q = Q.qs[Q.i];
  if (q.qt === 'type') { const v = ($('#typeIn') || {}).value || ''; if (!v.trim()) return; grade(norm(v) === norm(q.ans), { val: v }); }
  else if (q.qt === 'build') { const p = T.picked || []; if (!p.length) return; grade(p.map(i => q.tiles[i].j).join('') === q.ans, { picked: [...p] }); }
  else if (q.qt === 'order') { const p = T.picked || []; if (p.length !== q.items.length) return; grade(p.map(i => q.items[i].id).join(',') === q.ans, { picked: [...p] }); }
}
function matchClick(side, k) {
  const Q = S.cursor.quiz, q = Q.qs[Q.i];
  T.done = T.done || []; T.bad = null;
  if (side === 'l') { T.l = k; speak(q.pairs[k].l); } else T.r = k;
  if (T.l !== undefined && T.r !== undefined) {
    if (T.l === T.r) { T.done.push(T.l); sfx(true); } else { T.miss = (T.miss || 0) + 1; T.bad = { l: T.l, r: T.r }; sfx(false); }
    T.l = undefined; T.r = undefined;
  }
  if (T.done.length === q.pairs.length) { grade(true); return; }
  V.keepScroll = true; render();
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.setting) { const k = t.dataset.setting; S.settings[k] = t.type === 'checkbox' ? t.checked : parseFloat(t.value); if (k === 'rate') $('#rateVal').textContent = S.settings.rate.toFixed(1) + '×'; save(); if (['unlockAll', 'furigana'].includes(k)) { V.keepScroll = true; render(); } }
  if (t.dataset.action === 'import' && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => importData(fr.result);
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener('input', e => { const t = e.target; if (t.dataset.setting === 'rate') { S.settings.rate = parseFloat(t.value); $('#rateVal').textContent = S.settings.rate.toFixed(1) + '×'; } });
function importData(text) {
  try {
    const d = JSON.parse(String(text).trim()); if (d.v !== 1 || !d.lessons) throw 0;
    S = sanitizeState(d); if (S.cursor && S.cursor.phase === 'quiz') S.cursor.quiz = buildQuiz(LMAP[S.cursor.id]); S.resetAt = Date.now(); save(); pushNow(); closeModal(); V = { name: 'home' }; render(); toast('✅ 进度已导入');
  } catch (er) { toast('❌ 进度代码不正确，请完整复制后再试'); }
}
function showBackup() {
  showModal(`<div class="p-6">
    <h3 class="text-xl font-black">备份 / 转移进度</h3>
    <p class="text-sm text-slate-500 mt-1">在旧设备上复制进度代码，到新设备上粘贴导入，就能接着学。导入的进度会替换这里的进度${syncRef ? '，并同步到你的其他设备' : ''}。</p>
    <label for="bkOut" class="block font-bold mt-4 text-sm">这台设备的进度代码</label>
    <textarea id="bkOut" readonly class="mt-1 w-full h-24 rounded-xl border-2 border-slate-200 p-2 text-xs font-mono bg-white">${esc(JSON.stringify(S))}</textarea>
    <div class="grid grid-cols-2 gap-2 mt-2">
      <button data-action="copycode" class="${btn('py-3 bg-white border-2 border-slate-200')}">📋 复制代码</button>
      <button data-action="savefile" class="${btn('py-3 bg-white border-2 border-slate-200')}">⬇ 保存为文件</button>
    </div>
    <label for="bkIn" class="block font-bold mt-5 text-sm">导入进度（会替换这台设备上的进度）</label>
    <textarea id="bkIn" placeholder="把进度代码粘贴到这里" class="mt-1 w-full h-20 rounded-xl border-2 border-slate-200 p-2 text-xs font-mono bg-white"></textarea>
    <div class="grid grid-cols-2 gap-2 mt-2">
      <button data-action="importcode" class="${btn('py-3 bg-teal-500 border-teal-700 text-white')}">导入代码</button>
      <label class="${btn('py-3 bg-white border-2 border-slate-200 text-center cursor-pointer')}">选择文件<input type="file" accept=".json,application/json,text/plain" data-action="import" class="hidden"></label>
    </div>
  </div>`);
}
async function saveFile() {
  const name = `樱语日语-进度-${today()}.json`, data = JSON.stringify(S, null, 1);
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (er) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: name, data }); toast('已保存进度文件'); } catch (er) { toast(er && er.code === 'declined' ? '已取消保存' : '这里无法保存文件，请改用「复制代码」'); }
    return;
  }
  if (inFrame) { toast('这里无法保存文件，请改用「复制代码」'); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  toast('已保存进度文件');
}
document.addEventListener('keydown', e => {
  if ($('#modal').innerHTML && e.key === 'Escape') return closeModal();
  if (V.name === 'learn') {
    if (e.key === 'ArrowRight') learnMove(1);
    else if (e.key === 'ArrowLeft') learnMove(-1);
    else if (e.key === ' ') { e.preventDefault(); const c = $('#card'); if (c) { V.flipped = !V.flipped; c.classList.toggle('flipped', V.flipped); } }
    else if (e.key.toLowerCase() === 'p') { const bs = document.querySelectorAll('[data-action="speak"]'); const b = bs[bs.length - 1]; if (b) speak(b.dataset.say, b, b.dataset.role); }
  } else if (V.name === 'quiz') {
    const Q = S.cursor.quiz, q = Q.qs[Q.i], answered = Q.fb && Q.fb.i === Q.i;
    if (answered && e.key === 'Enter') { e.preventDefault(); nextQ(); }
    else if (!answered && e.key === 'Enter' && q.qt !== 'mc') { e.preventDefault(); doCheck(); }
    else if (!answered && q.qt === 'mc' && /^[1-4]$/.test(e.key) && e.target.tagName !== 'INPUT') { const k = +e.key - 1; if (q.opts[k]) grade(q.opts[k].v === q.ans, { sel: k }); }
  }
});

/* ---------- 学习计时（只在学习/练习页面、窗口可见、3 分钟内有操作时计时） ---------- */
let lastAct = Date.now(), tick = 0;
['click', 'keydown', 'touchstart', 'mousemove'].forEach(ev => addEventListener(ev, () => lastAct = Date.now(), { passive: true }));
setInterval(() => {
  if (document.hidden || !['learn', 'quiz', 'intro'].includes(V.name) || Date.now() - lastAct > 180000 || !S.cursor) return;
  const d = today(); S.days[d] = (S.days[d] || 0) + 1; rec(S.cursor.id).secs++;
  if (++tick % 10 === 0) save();
  const el = $('#todayMin'); if (el) el.textContent = fmtMin(S.days[d]);
}, 1000);
addEventListener('beforeunload', save);

render();
initSync();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
